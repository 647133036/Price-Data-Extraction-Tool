[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-extractor"
version = "0.0.1"
description = "Weekly Coles and Woolworths Australia price extraction tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
    "boto3>=1.34.0",
    "APScheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "respx>=0.21.1", "ruff>=0.5.0"]

[project.scripts]
price-extractor = "price_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
